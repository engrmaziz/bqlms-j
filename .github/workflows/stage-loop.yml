name: stage-loop

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "23 */2 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: stage-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Advance the build
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: bash .github/scripts/stage-loop.sh
